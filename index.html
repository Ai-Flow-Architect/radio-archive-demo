<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ラジオ番組アーカイブ 切り出しシステム デモ</title>
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="ラジオ番組のMP3を一括解析し、ゲスト出演区間の切り出し・MP3/MP4・サムネイル・縦長動画を作る流れのデモ（架空データ）">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232e2f33'/%3E%3Ccircle cx='32' cy='32' r='9' fill='%23e0362c'/%3E%3C/svg%3E">
<meta property="og:title" content="ラジオ番組アーカイブ 切り出しシステム デモ">
<meta property="og:description" content="MP3の一括解析・ゲスト区間の確認・フェードつき書き出し・サムネイルと動画の自動作成（架空データ）">
<meta property="og:type" content="website">
<meta property="og:image" content="https://ai-flow-architect.github.io/radio-archive-demo/screenshot.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Barlow:wght@500;600;700&display=swap">
<style>
/* 白地・墨色・放送中の赤を1点だけ（端末がダークでも白のまま） */
:root,:root[data-theme="dark"]{color-scheme:light}
:root{--paper:#fff;--mist:#f4f5f7;--line:#e4e4e8;--ink:#1c1d21;--sub:#6b6d75;--graphite:#2e2f33;--air:#e0362c;--air-soft:#fdecea;--blue:#1e7fd8;--blue-soft:#e8f2fc;--ok:#1f8a5b;--ok-soft:#e6f4ee;--warn:#b26a00;--warn-soft:#fff3e0;
  --f-body:"Noto Sans JP","Hiragino Kaku Gothic ProN",system-ui,sans-serif;--f-num:"Barlow","Noto Sans JP",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.7}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
header.top{position:sticky;top:0;z-index:20;background:var(--paper);box-shadow:0 1px 0 var(--line)}
.top-in{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding:12px 24px;max-width:1240px;margin:0 auto}
.brand{margin-right:auto;display:flex;align-items:center;gap:10px}
.onair{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-num);font-weight:700;font-size:12px;letter-spacing:.12em;color:var(--air);border:1.5px solid var(--air);border-radius:3px;padding:1px 7px}
.onair::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--air)}
.brand b{font-weight:900;font-size:18px;letter-spacing:.02em}
.brand small{color:var(--sub);font-size:11.5px}
nav.tabs{display:flex;flex-wrap:wrap;gap:2px}
nav.tabs button{border:0;background:none;padding:8px 12px;color:var(--sub);font-weight:700;font-size:13px;border-bottom:2px solid transparent}
nav.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink)}
.note{background:var(--mist);font-size:12px;color:var(--sub)}
.note div{max-width:1240px;margin:0 auto;padding:6px 24px}
main{max-width:1240px;margin:0 auto;padding:22px 24px 72px}
@media (max-width:700px){.top-in,main,.note div{padding-left:14px;padding-right:14px}}
h1{font-weight:900;font-size:24px;margin:0 0 4px}
h2{font-size:13px;letter-spacing:.06em;color:var(--sub);margin:22px 0 10px}
.lead{color:var(--sub);margin:0 0 16px}
.flow{display:flex;flex-wrap:wrap;gap:0;list-style:none;padding:0;margin:0 0 20px;border:1px solid var(--line);border-radius:6px;overflow:hidden;font-size:12px}
.flow li{flex:1 1 110px;text-align:center;padding:7px 4px;color:var(--sub);border-right:1px solid var(--line)}
.flow li:last-child{border-right:0}
.flow li.on{background:var(--graphite);color:#fff;font-weight:700}
.panel{border:1px solid var(--line);border-radius:8px;padding:16px;background:var(--paper)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.grid3{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px}
@media (max-width:900px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
.btn{border:0;background:var(--graphite);color:#fff;border-radius:4px;padding:9px 16px;font-weight:700;font-size:13px}
.btn:hover{background:#000}
.btn:disabled{background:#c9cad0;cursor:not-allowed}
.btn.sub{background:var(--paper);color:var(--ink);border:1px solid var(--line);font-weight:400}
.btn.air{background:var(--air)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:12px 0}
.stat{border:1px solid var(--line);border-radius:6px;padding:8px 12px}
.stat small{display:block;color:var(--sub);font-size:11.5px}
.stat b{font-family:var(--f-num);font-size:22px;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--sub);background:var(--mist)}
.tbl{max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:6px}
.bar{height:6px;background:var(--mist);border-radius:3px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--blue);transition:width .3s}
.st{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:3px;white-space:nowrap}
.st.q{background:var(--mist)} .st.a{background:var(--blue-soft);color:var(--blue)} .st.d{background:var(--ok-soft);color:var(--ok)} .st.e{background:var(--air-soft);color:var(--air)} .st.w{background:var(--warn-soft);color:var(--warn)}
label.f{display:grid;gap:4px;font-size:12.5px;font-weight:700}
label.f input,label.f select,.inp{border:1px solid var(--line);border-radius:4px;padding:7px 9px;background:var(--paper);font-weight:400}
.tx{max-height:380px;overflow:auto;border:1px solid var(--line);border-radius:6px;font-size:13px}
.tx p{margin:0;padding:6px 10px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:64px 1fr;gap:8px}
.tx p.in{background:var(--blue-soft)} .tx p.hit{background:var(--ok-soft)} .tx p.unsure{background:var(--warn-soft)}
.tx .t{font-family:var(--f-num);color:var(--sub)}
.seg{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-bottom:8px}
.seg b{font-family:var(--f-num)}
.wave-wrap{position:relative;border:1px solid var(--line);border-radius:6px;background:var(--mist);overflow:hidden}
canvas{display:block;max-width:100%}
#wave{width:100%;height:150px;cursor:crosshair}
.times{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0}
.err{color:var(--air);font-size:13px;min-height:1.2em}
.ok{color:var(--ok);font-size:13px}
.canvas-box{border:1px solid var(--line);border-radius:6px;padding:8px;background:var(--mist)}
#thumb,#video{width:100%;height:auto;background:#000;border-radius:4px}
#vert{width:100%;max-width:260px;height:auto;background:#000;border-radius:6px}
.tpl{display:flex;gap:6px;flex-wrap:wrap}
.tpl button{border:1px solid var(--line);background:var(--paper);border-radius:4px;padding:5px 10px;font-size:12.5px}
.tpl button[aria-pressed="true"]{border-color:var(--ink);font-weight:700}
.mode{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
.mode button{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:10px;text-align:left;font-size:12.5px}
.mode button b{display:block;font-size:14px}
.mode button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
@media (max-width:600px){.mode{grid-template-columns:minmax(0,1fr)}}
.foot{max-width:1240px;margin:0 auto;padding:18px 24px 40px;font-size:11px;color:var(--sub);border-top:1px solid var(--line)}
</style>
</head>
<body>

<header class="top"><div class="top-in">
  <div class="brand"><span class="onair">ON AIR</span><b>番組アーカイブ</b><small>切り出しシステム｜デモ（架空の番組・架空のデータ）</small></div>
  <nav class="tabs" id="tabs">
    <button data-tab="batch" id="tab-batch">① 一括解析</button>
    <button data-tab="guest" id="tab-guest">② ゲストと区間</button>
    <button data-tab="cut" id="tab-cut">③ 切り出し・書き出し</button>
    <button data-tab="media" id="tab-media">④ 動画とサムネイル</button>
  </nav>
</div></header>
<div class="note"><div>このデモはブラウザの中だけで動きます。③の切り出し・書き出しと④のサムネイル・動画画面は実際に動きます（お手元のMP3も読み込めます・外へは送りません）。①②の解析は見本のデータで流れをお見せしています。</div></div>
<main id="app"></main>
<footer class="foot">番組名・ゲスト名・放送回はすべて架空です。本番では文字起こし（無料のAI）とMP3・MP4の作成を Windows のPCで行い、スマホからは同じ画面で進捗の確認・試聴・出力の指示ができる構成を想定しています。</footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js"></script>
<script>
"use strict";
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const mmss = t => { t = Math.max(0, t); return Math.floor(t / 60) + ":" + pad(Math.floor(t % 60)) + "." + Math.floor((t % 1) * 10); };
const parseT = s => { const m = String(s).trim().match(/^(\d+):(\d{1,2}(?:\.\d)?)$/); return m ? Number(m[1]) * 60 + Number(m[2]) : (isFinite(Number(s)) ? Number(s) : NaN); };

// ===== 見本データ（架空） =====
const GUESTS = ["甲野 花子", "乙野 太郎", "丙野 美咲", "丁野 健", "戊野 さくら", "己野 夫妻"];
function mockFiles(n) {
  const out = []; let d = new Date(2016, 3, 3);
  for (let i = 0; i < n; i++) {
    const g = GUESTS[i % GUESTS.length];
    out.push({ id: "f" + i, name: d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) + "_放送.mp3", date: d.getFullYear() + "/" + (d.getMonth() + 1) + "/" + d.getDate(), guest: g, min: 24 + (i % 7), status: "q", prog: 0, err: i === 3 });
    d.setDate(d.getDate() + 7);
  }
  return out;
}
const st = { tab: "batch", files: mockFiles(12), running: false, night: true, timer: null, sel: "f0", mode: "A", digest: 90,
  program: "RADIO WAVE", date: "2016/4/3", guest: "甲野 花子", tpl: "spot", photo: null,
  audio: null, start: 0, end: 0, fadeIn: 2, fadeOut: 3, kbps: 192, out: "both", msg: "", err: "" };

// ===== ① 一括解析（見本の処理を順番に進める） =====
function tick() {
  const cur = st.files.find(f => f.status === "a") || st.files.find(f => f.status === "q");
  if (!cur) { stopRun(); render(); return; }
  cur.status = "a"; cur.prog = Math.min(100, cur.prog + 20);
  if (cur.prog >= 60 && cur.err) { cur.status = "e"; cur.prog = 60; }
  else if (cur.prog >= 100) { cur.status = cur.id === "f5" ? "w" : "d"; }
  if (st.tab === "batch") render();
}
function startRun() { if (st.running) return; st.running = true; st.timer = setInterval(tick, 350); }
function stopRun() { st.running = false; clearInterval(st.timer); }
function viewBatch() {
  const c = k => st.files.filter(f => f.status === k).length;
  return '<h1>MP3を一括で解析する</h1><p class="lead">フォルダをまとめて登録すると、古い放送から順番に文字起こしとゲストの判定を進めます。途中で止めても、続きから再開できます。</p>' +
    '<div class="row"><label class="btn sub" for="folder" style="cursor:pointer">フォルダを登録（MP3）</label><input id="folder" type="file" accept=".mp3,audio/mpeg" multiple webkitdirectory hidden>' +
    '<button class="btn sub" id="addMock">見本を12本追加</button>' +
    (st.running ? '<button class="btn" id="pause">一時停止</button>' : '<button class="btn" id="run">' + (c("d") + c("w") + c("e") ? "続きから再開" : "解析を始める") + "</button>") +
    '<label class="row" style="font-size:13px"><input type="checkbox" id="night"' + (st.night ? " checked" : "") + "> 夜間も続けて処理する</label></div>" +
    '<div class="stats"><div class="stat"><small>登録</small><b id="cAll">' + st.files.length + '</b></div><div class="stat"><small>待ち</small><b>' + c("q") + '</b></div><div class="stat"><small>解析中</small><b>' + c("a") + '</b></div><div class="stat"><small>完了</small><b id="cDone">' + c("d") + '</b></div><div class="stat"><small>要確認</small><b id="cWarn">' + c("w") + '</b></div><div class="stat"><small>エラー</small><b id="cErr">' + c("e") + "</b></div></div>" +
    '<div class="tbl"><table id="fileTable"><thead><tr><th>ファイル</th><th>放送日</th><th>ゲスト（判定）</th><th>長さ</th><th>進み具合</th><th>状態</th><th></th></tr></thead><tbody>' +
    st.files.map(f => "<tr data-file=\"" + f.id + '"><td class="num">' + esc(f.name) + '</td><td class="num">' + esc(f.date) + "</td><td>" + (f.status === "d" || f.status === "w" ? esc(f.guest) : "—") + '</td><td class="num">' + f.min + ' 分</td><td><div class="bar"><i style="width:' + f.prog + '%"></i></div></td><td>' +
      { q: '<span class="st q">待ち</span>', a: '<span class="st a">解析中</span>', d: '<span class="st d">完了</span>', w: '<span class="st w">要確認</span>', e: '<span class="st e">エラー</span>' }[f.status] +
      "</td><td>" + (f.status === "e" ? '<button class="btn sub" data-retry="' + f.id + '">再処理</button>' : (f.status === "d" || f.status === "w") ? '<button class="btn sub" data-open="' + f.id + '">確認する</button>' : "") + "</td></tr>").join("") +
    "</tbody></table></div><p style=\"font-size:12px;color:var(--sub)\">※ 文字起こしと判定の結果は保存して再利用します。動画を作り直す時に、解析をやり直す必要はありません。</p>";
}

// ===== ② ゲストと区間（見本の文字起こし） =====
function transcript(f) {
  const g = f.guest;
  return [
    [0, "オープニング曲", ""], [65, "こんばんは。今週も始まりました、" + st.program + "。", ""], [420, "今週のおたよりコーナーです。", ""],
    [742, "さあ、ここからはゲストコーナー。今夜のゲストは " + g + " さんです！", "in"], [760, "こんばんは、" + g + "です。よろしくお願いします。", "hit"],
    [905, "最初にダンスを始めたきっかけは何でしたか？", "hit"], [1012, "高校の文化祭で、先輩のステージを見たのが最初でした。", "hit"],
    [1188, "（笑い声）それは忘れられないですね。", "hit"], [1265, "「" + g.replace(" ", "") + "」さんの今後の予定も教えてください。", "unsure"],
    [1350, "来月の発表会に向けて、毎日練習しています。", "hit"], [1442, "今夜のゲストは " + g + " さんでした。ありがとうございました！", "in"],
    [1470, "ありがとうございました。", "hit"], [1500, "それではまた来週。", ""],
  ];
}
function viewGuest() {
  const f = st.files.find(x => x.id === st.sel) || st.files[0];
  const done = st.files.filter(x => x.status === "d" || x.status === "w");
  const lines = transcript(f);
  const segS = 742, segE = 1480;
  const digests = [[905, 905 + st.digest, "きっかけの話"], [1012, 1012 + st.digest, "文化祭の思い出"], [1350, 1350 + st.digest, "発表会に向けて"]];
  return '<h1>ゲストと出演区間を確かめる</h1><p class="lead">文字起こしから、ゲストの紹介と最後のあいさつを見つけて、出演区間を推定します。名前の表記の揺れや、判定に自信がない箇所は色で知らせます。</p>' +
    '<div class="row" style="margin-bottom:12px"><label class="f" style="min-width:260px">放送回<select id="selFile">' + (done.length ? done : st.files).map(x => '<option value="' + x.id + '"' + (x.id === f.id ? " selected" : "") + ">" + esc(x.date + "　" + (done.includes(x) ? x.guest : "（未解析）")) + "</option>").join("") + '</select></label><label class="f">ゲスト名（修正できます）<input id="guestName" class="inp" value="' + esc(f.guest) + '"></label><button class="btn sub" id="unify">表記を統一する</button></div>' +
    '<div class="mode" id="modes">' + [["A", "A：ゲストコーナー全体", "紹介から終わりのあいさつまで、司会との会話も含めて省略しない"], ["B", "B：時間を指定", "開始と終了を分・秒で指定（③の波形で調整・試聴）"], ["C", "C：AIダイジェスト", "印象的な会話を短くまとめる候補を3本"]].map(([k, t, d]) => '<button data-mode="' + k + '" aria-pressed="' + (st.mode === k) + '"><b>' + t + "</b>" + d + "</button>").join("") + "</div>" +
    '<div class="grid3"><div><h2 style="margin-top:0">文字起こし（見本）</h2><div class="tx" id="tx">' + lines.map(([t, s, c]) => '<p class="' + c + '"><span class="t">' + mmss(t).slice(0, -2) + "</span><span>" + esc(s) + (c === "unsure" ? "　<b style=\"color:var(--warn)\">← 名前の表記が違う（要確認）</b>" : "") + "</span></p>").join("") + '</div><p style="font-size:12px;color:var(--sub)">青＝紹介と終わりのあいさつ／緑＝出演区間／橙＝判定に自信がない箇所</p></div>' +
    '<div><h2 style="margin-top:0">推定した区間</h2>' +
    (st.mode === "C" ? '<div class="row" style="margin-bottom:8px">' + [60, 90, 180].map(n => '<button class="btn sub" data-dig="' + n + '"' + (st.digest === n ? ' style="border-color:var(--ink);font-weight:700"' : "") + ">" + n + " 秒</button>").join("") + "</div>" + digests.map(([a, b, t], i) => '<div class="seg" data-cand="' + i + '"><span class="st a">候補' + (i + 1) + "</span><b>" + mmss(a).slice(0, -2) + "〜" + mmss(b).slice(0, -2) + "</b><span>" + t + '</span><button class="btn sub" data-useseg="' + a + "_" + b + '">この区間で切り出す</button></div>').join("") :
      '<div class="seg" id="segA"><span class="st d">出演区間</span><b>' + mmss(segS).slice(0, -2) + "〜" + mmss(segE).slice(0, -2) + "</b><span>（" + Math.round((segE - segS) / 60) + ' 分）</span><button class="btn sub" data-useseg="' + segS + "_" + segE + '">この区間で切り出す</button></div>') +
    '<p style="font-size:12.5px">会話の途中で切れないよう、区間の前後は文の切れ目に合わせます。位置は③の波形で手で直せます。</p>' +
    '<h2>ゲストの登録（再利用）</h2><table><tbody>' + GUESTS.map(g => "<tr><td>" + esc(g) + '</td><td class="num">' + st.files.filter(x => x.guest === g).length + " 回出演</td></tr>").join("") + "</tbody></table></div></div>";
}

// ===== ③ 切り出し・書き出し（実際に動く） =====
let ctx = null, playing = null;
function audioCtx() { if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)(); return ctx; }
async function makeSample() {
  // 見本の音（合成）: 60秒。0〜12秒＝曲、12〜48秒＝話し声のような抑揚、48秒〜＝曲
  const sr = 22050, len = sr * 60, oc = new OfflineAudioContext(1, len, sr);
  const buf = oc.createBuffer(1, len, sr), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) {
    const t = i / sr;
    if (t < 12 || t > 48) { d[i] = 0.25 * Math.sin(2 * Math.PI * 220 * t) * (0.6 + 0.4 * Math.sin(2 * Math.PI * 0.5 * t)) + 0.12 * Math.sin(2 * Math.PI * 330 * t); }

  const t = e.target;
  if (t.id === "night") st.night = t.checked;
  else if (t.id === "folder") { const fs = [...t.files].filter(f => /\.mp3$/i.test(f.name)); fs.forEach((f, i) => st.files.push({ id: "u" + Date.now() + i, name: f.name, date: "（ファイル名から取得）", guest: "（解析後に判定）", min: "—", status: "q", prog: 0, err: false })); render(); }
  else if (t.id === "selFile") { st.sel = t.value; render(); }
  else if (t.id === "mp3" && t.files[0]) { try { await setAudio(await loadAudioFile(t.files[0])); } catch (err) { st.err = "このファイルは読み込めませんでした（MP3・WAV などの音声ファイルを選んでください）。"; render(); } }
  else if (t.id === "tStart" || t.id === "tEnd") {
    const s = parseT($("tStart").value), en = parseT($("tEnd").value), dur = st.audio.buffer.duration;
    if (!(s >= 0) || !(en > s) || en > dur + 0.05) { st.err = "開始と終了は 0:00.0〜" + mmss(dur) + " の間で、終了を開始より後にしてください。"; }
    else { st.start = s; st.end = Math.min(en, dur); st.err = ""; }
    // 画面全体は描き直さない（もう一方の欄に入力中の値を消さないため）
    $("cutErr").textContent = st.err; $("cutMsg").textContent = ""; $("selLen").textContent = "切り出す長さ " + mmss(st.end - st.start); drawWave();
  }
  else if (t.id === "fi" || t.id === "fo") { const v = Math.max(0, Math.min(10, Number(t.value) || 0)); if (t.id === "fi") st.fadeIn = v; else st.fadeOut = v; render(); }
  else if (t.id === "kbps") st.kbps = Number(t.value);
  else if (t.id === "outSel") st.out = t.value;
  else if (t.id === "photo" && t.files[0]) { const img = new Image(); img.onload = () => { photoImg = img; render(); }; img.src = URL.createObjectURL(t.files[0]); }
  else if (["pName", "pDate", "pGuest"].includes(t.id)) { st.program = $("pName").value.trim() || "番組名"; st.date = $("pDate").value.trim(); st.guest = $("pGuest").value.trim() || "ゲスト"; render(); }
});
window.addEventListener("resize", () => { if (st.tab === "cut") drawWave(); });
document.fonts && document.fonts.ready.then(() => { if (st.tab === "media") render(); });
window.__demo = { st, makeSample, setAudio, renderClip, toMp3, fitText, drawFitted };
render();
</script>
